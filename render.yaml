# Render Blueprint — New → Blueprint → เลือก repo นี้ (ค่า sync: false ต้องกรอกเองในหน้า Render)
services:
  - type: web
    name: money-captuer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:create_default_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TYPHOON_API_KEY
        sync: false
      - key: TYPHOON_LLM_MODEL
        value: typhoon-v2.5-30b-a3b-instruct
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CATEGORIES
        value: อาหาร,เครื่องดื่ม/กาแฟ,เดินทาง,ช้อปปิ้ง,ของใช้,บิล/ค่าบริการ,สุขภาพ,บันเทิง,อื่นๆ
