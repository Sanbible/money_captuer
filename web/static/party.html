<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ปาร์ตี้ · Money Capture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="/dashboard">Money <span>Capture</span></a>
      <a class="btn btn-small" href="/parties">← ปาร์ตี้ของฉัน</a>
      <button id="refresh" class="btn btn-small" type="button">รีเฟรช</button>
    </div>
  </header>

  <main class="container stack">
    <p id="page-error" class="notice notice-error hidden" role="alert"></p>

    <section id="head" class="card stack hidden">
      <div class="party-card-head">
        <h1 id="party-name" style="font-size: 1.4rem"></h1>
        <span id="party-status" class="badge"></span>
      </div>
      <div class="toolbar">
        <div>
          <div class="muted">โค้ดเชิญ</div>
          <div id="party-code" class="code"></div>
        </div>
        <button id="copy-link" class="btn btn-small" type="button">คัดลอกลิงก์เชิญ</button>
        <div class="spacer"></div>
        <button id="add-expense" class="btn btn-primary hidden" type="button">+ เพิ่มรายการ</button>
        <button id="end-party" class="btn btn-danger hidden" type="button">ปิดปาร์ตี้และสรุป</button>
      </div>
      <p id="copy-note" class="notice notice-ok hidden"></p>
    </section>

    <section id="settle-card" class="card stack hidden">
      <h2 id="settle-title" class="card-title"></h2>
      <div id="transfers" class="stack"></div>
    </section>

    <section id="balance-card" class="card hidden">
      <h2 class="card-title">ยอดสุทธิ</h2>
      <p class="muted" style="margin-top: -4px">บวก = ได้เงินคืน · ลบ = ต้องโอนให้คนอื่น</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>สมาชิก</th><th class="num">จ่ายไป</th><th class="num">ส่วนที่ต้องจ่าย</th><th class="num">สุทธิ</th></tr></thead>
          <tbody id="balances"></tbody>
        </table>
      </div>
    </section>

    <section id="expense-card" class="card hidden">
      <h2 class="card-title">รายการ <span id="total" class="muted"></span></h2>
      <div id="expenses" class="stack"></div>
      <p id="no-expenses" class="empty hidden">ยังไม่มีรายการ — กด "+ เพิ่มรายการ" เพื่ออัปสลิปหรือใส่ยอดเงินสด</p>
    </section>

    <section id="member-card" class="card hidden">
      <h2 class="card-title">สมาชิก <span id="member-count" class="muted"></span></h2>
      <div id="members" class="member-list"></div>
    </section>
  </main>

  <dialog id="expense-dialog" aria-labelledby="expense-title">
    <div class="dialog-head">
      <h2 id="expense-title">เพิ่มรายการ</h2>
      <button id="close-dialog" class="btn btn-small" type="button" aria-label="ปิด">✕</button>
    </div>
    <form id="expense-form" class="dialog-body">
      <div id="slip-field" class="field">
        <label for="slip-file">รูปสลิป (ไม่ใส่ก็ได้ ถ้าจ่ายเงินสด)</label>
        <input id="slip-file" type="file" accept="image/png,image/jpeg">
      </div>
      <div id="reading" class="hidden" style="text-align: center">
        <div class="spinner"></div>
        <p>กำลังอ่านสลิป… อาจใช้เวลาสักครู่</p>
      </div>
      <p id="form-notice" class="notice hidden"></p>
      <div class="row">
        <div class="field">
          <label for="f-amount">ยอด (บาท)</label>
          <input id="f-amount" inputmode="decimal" required placeholder="เช่น 1,234.50" maxlength="20">
        </div>
        <div class="field">
          <label for="f-payer">คนจ่าย</label>
          <select id="f-payer" required></select>
        </div>
      </div>
      <div class="field">
        <label for="f-note">หมายเหตุ</label>
        <input id="f-note" maxlength="100" placeholder="เช่น ค่าหมูกระทะ">
      </div>
      <fieldset class="field">
        <legend class="label-like">ใครมีส่วน (หารเท่ากัน) — <button id="select-all" class="link-btn" type="button">เลือกทุกคน</button></legend>
        <div id="f-participants" class="checkbox-list"></div>
      </fieldset>
      <p id="share-preview" class="muted"></p>
      <p id="save-error" class="notice notice-error hidden" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancel-dialog" class="btn" type="button">ยกเลิก</button>
        <button id="save-expense" class="btn btn-primary" type="submit">บันทึก</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/party.js"></script>
</body>
</html>
