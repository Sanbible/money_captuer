<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Money Capture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="hero">
    <div class="card">
      <h1>Money <span style="color: var(--brand)">Capture</span></h1>
      <p class="muted">จดรายจ่ายจากสลิปโอนเงินอัตโนมัติ แล้วดูสรุปเป็นกราฟ</p>
      <ol class="steps">
        <li>อัปโหลดรูปสลิป (หรือส่งเข้าบอท Discord)</li>
        <li>ระบบอ่านยอดเงิน วันที่ และผู้รับให้เอง</li>
        <li>เลือกหมวด แล้วดูกราฟรายจ่ายรายเดือน</li>
      </ol>

      <button id="login-discord" class="btn btn-discord btn-block" type="button">เข้าสู่ระบบด้วย Discord</button>
      <button id="login-google" class="btn btn-block hidden" type="button" style="margin-top: 10px">เข้าสู่ระบบด้วย Google</button>

      <form id="email-form" class="hidden">
        <div class="divider">หรือใช้อีเมล</div>
        <div class="field">
          <label for="email">อีเมล</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <button id="send-link" class="btn btn-block" type="submit">ส่งลิงก์เข้าสู่ระบบทางอีเมล</button>
      </form>

      <p id="message" class="notice hidden" role="status" style="margin-top: 12px"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/static/app.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const show = (kind, text) => {
      $("message").className = `notice notice-${kind}`;
      $("message").textContent = text;
    };

    MC.session().then((s) => { if (s) location.replace("/dashboard"); }).catch((e) => show("error", e.message));
    MC.providers().then((p) => {
      $("login-google").classList.toggle("hidden", !p.google);
      $("email-form").classList.toggle("hidden", !p.email);
    });

    async function oauth(provider, button) {
      button.disabled = true;
      try {
        const { supabase } = await MC.init();
        const { error } = await supabase.auth.signInWithOAuth({
          provider,
          options: { redirectTo: `${location.origin}/dashboard` },
        });
        if (error) throw error;
      } catch (e) {
        button.disabled = false;
        show("error", `เข้าสู่ระบบไม่สำเร็จ: ${e.message}`);
      }
    }
    $("login-discord").addEventListener("click", (e) => oauth("discord", e.currentTarget));
    $("login-google").addEventListener("click", (e) => oauth("google", e.currentTarget));

    $("email-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("send-link").disabled = true;
      try {
        const { supabase } = await MC.init();
        const { error } = await supabase.auth.signInWithOtp({
          email: $("email").value.trim(),
          options: { emailRedirectTo: `${location.origin}/dashboard` },
        });
        if (error) throw error;
        show("ok", "ส่งลิงก์แล้ว เปิดอีเมลแล้วกดลิงก์เพื่อเข้าสู่ระบบ");
      } catch (e) {
        $("send-link").disabled = false;
        const limited = e.status === 429 || /rate limit/i.test(e.message);
        show("error", limited ? "ส่งอีเมลถี่เกินไป ลองใหม่ในอีกสักครู่" : `ส่งลิงก์ไม่สำเร็จ: ${e.message}`);
      }
    });
  </script>
</body>
</html>
