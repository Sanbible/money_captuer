<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตั้งค่า · Money Capture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="/dashboard">Money <span>Capture</span></a>
      <a class="btn btn-small" href="/parties">ปาร์ตี้</a>
      <a class="btn btn-small" href="/dashboard">กลับไปหน้ารายจ่าย</a>
    </div>
  </header>

  <main class="container stack">
    <section class="card stack">
      <h1 style="font-size: 1.3rem">บัญชีของฉัน</h1>
      <div>
        <div class="muted">ชื่อ / อีเมล</div>
        <div id="name">–</div>
      </div>
      <div>
        <div class="muted">วิธีเข้าสู่ระบบที่ผูกไว้</div>
        <ul id="providers" style="margin: 4px 0 0; padding-left: 20px"></ul>
      </div>
      <p id="message" class="notice hidden" role="status"></p>
      <div>
        <button id="logout" class="btn" type="button">ออกจากระบบ</button>
      </div>
    </section>

    <section id="link-section" class="card stack hidden">
      <h2 style="font-size: 1.1rem">เชื่อมบัญชี Discord</h2>
      <p class="muted">เชื่อมแล้ว สลิปที่ส่งผ่านบอท Discord จะขึ้นในบัญชีนี้อัตโนมัติ (รวมถึงสลิปที่เคยส่งไว้ก่อนหน้า)</p>
      <div>
        <button id="link-discord" class="btn btn-discord" type="button">เชื่อมบัญชี Discord</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/static/app.js"></script>
  <script>
    (async () => {
      const PROVIDER_NAMES = { discord: "Discord", google: "Google", email: "อีเมล" };
      let session;
      try {
        session = await MC.requireSession();
      } catch {
        return;
      }
      const $ = (id) => document.getElementById(id);
      const show = (kind, text) => {
        $("message").className = `notice notice-${kind}`;
        $("message").textContent = text;
      };
      const { supabase } = await MC.init();

      // ข้อมูลล่าสุดจาก Supabase (session ที่เก็บไว้อาจยังไม่มี identity ที่เพิ่งเชื่อม)
      const { data } = await supabase.auth.getUser();
      const user = data.user || session.user;
      const identities = user.identities || [];
      $("name").textContent = MC.displayName(user);
      $("providers").replaceChildren(
        ...identities.map((i) => MC.el("li", { textContent: PROVIDER_NAMES[i.provider] || i.provider })),
      );
      $("logout").addEventListener("click", MC.signOut);

      const hasDiscord = identities.some((i) => i.provider === "discord");
      if (hasDiscord && location.hash.includes("access_token")) show("ok", "เชื่อมบัญชี Discord แล้ว");
      const enabled = await MC.providers();
      $("link-section").classList.toggle("hidden", hasDiscord || !enabled.discord);

      $("link-discord").addEventListener("click", async (event) => {
        event.currentTarget.disabled = true;
        const { error } = await supabase.auth.linkIdentity({
          provider: "discord",
          options: { redirectTo: `${location.origin}/settings` },
        });
        if (error) {
          event.currentTarget.disabled = false;
          const disabled = /manual linking/i.test(error.message);
          show("error", disabled ? "ระบบยังไม่เปิดให้เชื่อมบัญชี (ต้องเปิด Manual Linking ใน Supabase)"
                                 : `เชื่อมบัญชีไม่สำเร็จ: ${error.message}`);
        }
      });
    })();
  </script>
</body>
</html>
