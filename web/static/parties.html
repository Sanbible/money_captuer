<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ee">
  <title>ปาร์ตี้ · Money Capture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app has-tabbar">
    <div class="stack-sm" style="gap: 6px">
      <h1 class="page-title">ปาร์ตี้หารค่าใช้จ่าย</h1>
      <p class="muted small">ไปเที่ยวหรือกินข้าวกับเพื่อน ใครจ่ายอะไรก็บันทึกไว้ แล้วระบบสรุปให้ว่าใครต้องโอนให้ใครเท่าไหร่</p>
    </div>

    <p id="page-error" class="notice notice-error hidden" role="alert"></p>

    <form id="create-form" class="card stack">
      <h2 class="card-title-row"><span class="tile coral" style="width: 32px; height: 32px; border-radius: 12px"><i data-icon="plus" data-size="18"></i></span>สร้างปาร์ตี้ใหม่</h2>
      <div class="field">
        <label for="party-name">ชื่อปาร์ตี้</label>
        <input id="party-name" maxlength="100" required placeholder="เช่น ทริปเขาใหญ่">
      </div>
      <button id="create-btn" class="btn btn-primary btn-block" type="submit"><i data-icon="arrow-right"></i>สร้างปาร์ตี้</button>
    </form>

    <form id="join-form" class="card stack">
      <h2 class="card-title-row"><span class="tile" style="width: 32px; height: 32px; border-radius: 12px"><i data-icon="hash" data-size="18"></i></span>เข้าร่วมด้วยโค้ด</h2>
      <div class="field">
        <label for="join-code">โค้ด 6 ตัวจากเพื่อน หรือเปิดลิงก์เชิญที่เพื่อนส่งมา</label>
        <div class="join-row">
          <input id="join-code" class="code-input" maxlength="20" required placeholder="K7QM4X" autocapitalize="characters" autocomplete="off">
          <button id="join-btn" class="icon-btn dark" type="submit" aria-label="เข้าร่วม"><i data-icon="arrow-right"></i></button>
        </div>
      </div>
    </form>

    <div class="section-head">
      <h2>ปาร์ตี้ของฉัน</h2>
      <span id="party-count" class="muted small"></span>
    </div>
    <div id="party-list" class="stack-sm"></div>
    <div id="empty" class="card empty-state hidden">
      <span class="tile round big"><i data-icon="users" data-size="28"></i></span>
      <strong>ยังไม่มีปาร์ตี้</strong>
      <span class="muted small">สร้างใหม่ หรือขอโค้ดจากเพื่อน</span>
    </div>
  </main>

  <nav class="tabbar" aria-label="เมนูหลัก">
    <a class="tab" href="/dashboard" aria-label="รายจ่าย"><i data-icon="home" data-size="22"></i><span>รายจ่าย</span></a>
    <a class="tab" href="/parties" aria-current="page"><i data-icon="users" data-size="22"></i><span>ปาร์ตี้</span></a>
    <a class="tab-fab" href="/dashboard?upload=1" aria-label="อัปโหลดสลิป"><i data-icon="scan" data-size="24"></i></a>
    <a class="tab" href="/settings" aria-label="บัญชี"><i data-icon="user" data-size="22"></i><span>บัญชี</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/static/app.js"></script>
  <script>
    (async () => {
      const $ = (id) => document.getElementById(id);
      const { el } = MC;
      const STATUS = { open: "เปิดอยู่", closed: "รอโอนเงิน", settled: "เคลียร์แล้ว" };
      try {
        await MC.requireSession();
      } catch {
        return;
      }

      const pageError = (text) => {
        $("page-error").textContent = text || "";
        $("page-error").classList.toggle("hidden", !text);
      };
      const sb = (satang) => MC.baht(satang / 100);

      function card(p) {
        const net = p.my_net_satang;
        const [netClass, netIcon, netText] = net > 0 ? ["pos", "arrow-down-left", `ได้คืน ${sb(net)}`]
          : net < 0 ? ["neg", "arrow-up-right", `ต้องจ่าย ${sb(-net)}`] : ["", "check", "ไม่มียอดค้าง"];
        return el(
          "a",
          { className: "card party-card", href: `/party/${p.id}` },
          el("div", { className: "party-card-head" },
             el("strong", { textContent: p.name }),
             el("span", { className: `badge badge-${p.status}`, textContent: STATUS[p.status] || p.status })),
          el("div", { className: "muted small",
                      textContent: `สมาชิก ${p.member_count}/10 · รวม ${sb(p.total_satang)}${p.is_host ? " · คุณเป็น host" : ""}` }),
          el("div", { className: "party-card-foot" },
             el("span", { className: `net-pill ${netClass}` }, MC.icon(netIcon, 14), netText),
             MC.icon("chevron-right", 18)),
        );
      }

      async function load() {
        try {
          const items = await MC.api("/api/parties");
          $("party-list").replaceChildren(...items.map(card));
          $("party-count").textContent = items.length ? `${items.length} ปาร์ตี้` : "";
          $("empty").classList.toggle("hidden", items.length > 0);
        } catch (e) {
          pageError(`โหลดปาร์ตี้ไม่สำเร็จ: ${e.message}`);
        }
      }

      $("create-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        $("create-btn").disabled = true;
        pageError("");
        try {
          const party = await MC.api("/api/parties", { method: "POST", json: { name: $("party-name").value.trim() } });
          location.href = `/party/${party.id}`;
        } catch (e) {
          $("create-btn").disabled = false;
          pageError(`สร้างปาร์ตี้ไม่สำเร็จ: ${e.message}`);
        }
      });

      $("join-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        $("join-btn").disabled = true;
        pageError("");
        try {
          const res = await MC.api("/api/parties/join", { method: "POST", json: { code: $("join-code").value.trim() } });
          location.href = `/party/${res.id}`;
        } catch (e) {
          $("join-btn").disabled = false;
          pageError(e.message);
        }
      });

      load();
    })();
  </script>
</body>
</html>
